# Continuous integration for the AWS Cloud Attack Path Analyzer.
#
# Everything here runs offline against synthetic fixtures. No AWS credentials are
# configured, requested or used; the aws-scan command is never executed in CI.
# Actions are pinned to commit SHAs; the workflow token is read-only.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  lint:
    name: Lint, format and type-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff (lint)
        run: ruff check src tests scripts
      - name: Ruff (format check)
        run: ruff format --check src tests scripts
      - name: Mypy (strict)
        run: mypy src

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Unit, integration, regression and property tests
        run: python -m pytest -q --cov=attackpath --cov-report=xml --cov-report=term
      - name: Built-in scenario self-check
        run: python -m attackpath validate
      - name: Scenario fixtures are in sync
        run: python scripts/build_scenarios.py --check
      - name: Analyze the synthetic sample (CLI smoke test)
        run: |
          python -m attackpath analyze --input fixtures/sample_environment.json --output reports/ci
          python -m attackpath analyze --input fixtures/iam_policies --format markdown --quiet > reports/ci/policy-files.md
      - name: Upload sample reports
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sample-reports
          path: reports/ci
          retention-days: 14
      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 14

  dashboard:
    name: Dashboard smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install with the dashboard extra
        run: python -m pip install -e ".[dev,dashboard]"
      - name: Dashboard tests
        run: python -m pytest -q -m dashboard

  security:
    name: Security checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Bandit (static security analysis)
        run: bandit -q -r src -c pyproject.toml
      - name: pip-audit (dependency vulnerabilities)
        run: pip-audit --progress-spinner off --skip-editable
      - name: detect-secrets (tracked files against the committed baseline)
        run: |
          git ls-files -z | xargs -0 detect-secrets-hook --baseline .secrets.baseline
      - name: Gitleaks (secret scanning of the full history)
        # A pinned release binary with checksum verification, scanning every commit on
        # every run. The gitleaks GitHub Action derives a commit range from the push
        # event, which has no valid base on a repository's first push.
        env:
          GITLEAKS_VERSION: "8.24.3"
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSL --retry 3 -o "${asset}" "${base}/${asset}"
          curl -sSL --retry 3 -o checksums.txt "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${asset}$" checksums.txt | sha256sum -c -
          mkdir -p /tmp/gitleaks && tar -xzf "${asset}" -C /tmp/gitleaks gitleaks
          /tmp/gitleaks/gitleaks git --redact --no-banner --exit-code 1 .

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build
      - name: Install the wheel in a clean environment and run the self-check
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/python -m attackpath version
          /tmp/clean/bin/python -m attackpath validate
