[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-cloud-attack-path-analyzer"
version = "0.1.0"
description = "Graph-based IAM attack-path analysis for AWS environments: offline-first, read-only, evidence-driven."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ahmed Hany" }]
keywords = [
  "aws",
  "iam",
  "cloud-security",
  "attack-path",
  "privilege-escalation",
  "least-privilege",
  "security-posture",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "Intended Audience :: System Administrators",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
  "Typing :: Typed",
]
# The offline analyzer deliberately has no runtime dependencies: a smaller
# supply chain is part of the security design of this tool.
dependencies = []

[project.optional-dependencies]
aws = ["boto3>=1.35,<2", "botocore>=1.35,<2"]
dashboard = ["streamlit>=1.38,<2", "pandas>=2.1,<4"]
dev = [
  "boto3>=1.35,<2",
  "botocore>=1.35,<2",
  "pytest>=8.2,<10",
  "pytest-cov>=5,<8",
  "hypothesis>=6.100,<7",
  "ruff>=0.6,<1",
  "mypy>=1.11,<3",
  "bandit>=1.7.9,<2",
  "pip-audit>=2.7,<3",
  "detect-secrets>=1.5,<2",
  "build>=1.2,<2",
]

[project.scripts]
attackpath = "attackpath.cli:main"

[project.urls]
Homepage = "https://github.com/ahmedhany-cys/aws-cloud-attack-path-analyzer"
Repository = "https://github.com/ahmedhany-cys/aws-cloud-attack-path-analyzer"
Issues = "https://github.com/ahmedhany-cys/aws-cloud-attack-path-analyzer/issues"
Documentation = "https://github.com/ahmedhany-cys/aws-cloud-attack-path-analyzer/tree/main/docs"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
attackpath = ["py.typed", "data/*.toml", "data/scenarios/*.json"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = [
  "E", "F", "W",   # pycodestyle / pyflakes
  "I",             # isort
  "N",             # pep8-naming
  "UP",            # pyupgrade
  "B",             # bugbear
  "S",             # bandit-style security checks
  "C4",            # comprehensions
  "SIM",           # simplify
  "RUF",           # ruff-specific
  "T20",           # no stray print() outside the CLI
  "PIE",
  "RET",
  "PTH",           # prefer pathlib
]
ignore = [
  "E501",   # the formatter enforces code width; long finding texts are deliberate
  "RET505", # explicit else after return reads better in evaluator branches
  "SIM108", # ternaries are not always clearer
  "UP042",  # (str, Enum) mixins keep JSON serialization explicit
  "RUF005", # tuple concatenation reads fine for short remediation step lists
]

[tool.ruff.lint.per-file-ignores]
"src/attackpath/cli.py" = ["T201"]
"src/attackpath/selfcheck.py" = ["T201"]
"src/attackpath/dashboard/*" = ["T201"]
"scripts/*" = ["T201", "S603", "S607"]
"tests/**" = ["S101", "S105", "S106", "S108", "PTH"]

[tool.ruff.lint.isort]
known-first-party = ["attackpath"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src"]
exclude = ["src/attackpath/dashboard/app.py"]

[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "botocore", "botocore.*", "streamlit", "streamlit.*", "pandas", "pandas.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "aws: tests that exercise the boto3 adapter with stubbed clients (no credentials required)",
  "dashboard: tests that require streamlit",
]

[tool.coverage.run]
source = ["attackpath"]
omit = ["src/attackpath/dashboard/app.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.bandit]
exclude_dirs = ["tests", ".venv", "build", "dist", "scripts"]
